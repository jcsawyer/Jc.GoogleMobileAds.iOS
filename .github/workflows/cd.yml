on:
  push:
    branches: ["main"]

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: true
  DOTNET_VERSION: 10.0.x

permissions:
  contents: read
  checks: write

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Restore workloads
        working-directory: src
        run: dotnet workload restore
      - name: Build
        run: dotnet build src/jc-google-mobile-ads-ios.sln --configuration Release
      - name: Pack
        run: dotnet pack src/jc-google-mobile-ads-ios.sln --configuration Release --no-build --output artifacts/smoke-packages
      - name: NUnit simulator smoke tests
        run: dotnet test tests/Tests.Google.MobileAds.Host/Tests.Google.MobileAds.Host.csproj --configuration Release --logger trx --results-directory artifacts/dotnet-test
      - name: Publish test results
        if: ${{ !cancelled() && hashFiles('artifacts/dotnet-test/**/*.trx', 'artifacts/simulator/test-results.xml') != '' }}
        uses: EnricoMi/publish-unit-test-result-action/macos@v2
        with:
          check_name: iOS binding smoke tests
          comment_mode: 'off'
          compare_to_earlier_commit: false
          check_run: ${{ github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
          action_fail: true
          files: |
            artifacts/dotnet-test/**/*.trx
            artifacts/simulator/test-results.xml
      - name: Upload simulator results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: binding-smoke-tests
          path: |
            artifacts/dotnet-test
            artifacts/simulator
      - name: Push
        run: dotnet nuget push artifacts/smoke-packages/*.nupkg --source https://api.nuget.org/v3/index.json --skip-duplicate --api-key ${{ secrets.NUGET_APIKEY }}
